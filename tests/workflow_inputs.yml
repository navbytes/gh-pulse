name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: What to say
        required: true
        type: string
      verbose:
        description: Chatty logs
        type: boolean
        default: true
      level:
        description: Log level
        type: choice
        options:
          - info
          - warn
          - error
        default: warn
      count:
        type: number
        default: 3
      target:
        type: environment
      plain:
        description: no explicit type
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - run: echo hi
