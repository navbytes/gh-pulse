name: Release

on:
  push:
    tags: ['v*']
  # Run workflow on the Actions tab: with a version it validates, builds, creates the tag and publishes
  # (after the `release` environment's approval); without one it only builds and uploads artifacts.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.5.0 (must equal Cargo.toml on main). Empty: build only, publish nothing.'
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned for reproducible release binaries; keep >= Cargo.toml rust-version.
  RELEASE_TOOLCHAIN: 1.89.0
  TAG_RE: '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'

jobs:
  # Everything that decides whether this run may publish, in one place and before any build.
  meta:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$*" >&2; exit 1; }
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
            [ "$REF" = refs/heads/main ] || fail "run the release from main, not $REF"
          else
            echo "no version given: building artifacts only, nothing is published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$tag" =~ $TAG_RE ]] || fail "bad version: $tag"
          ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "$tag is not on main"
          [ "v$ver" = "$tag" ] || fail "$tag does not match the Cargo.toml version $ver"
          if [ "$EVENT" != push ] && gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            fail "tag $tag already exists"
          fi
          echo "releasing $tag at $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest, asset: gh-tui-darwin-arm64 }
          # cross-compiled on the arm64 runner; macos-13 (Intel) runners are deprecated
          - { target: x86_64-apple-darwin, runner: macos-latest, asset: gh-tui-darwin-amd64 }
          # glibc builds on the oldest hosted image so the binaries run on older distros;
          # musl was not chosen because it is unverified with this dependency tree.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, asset: gh-tui-linux-amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, asset: gh-tui-linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --target "$TARGET" --no-self-update
          rustup default "$RELEASE_TOOLCHAIN"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/gh-tui" "dist/$ASSET"
          strip "dist/$ASSET"
          chmod +x "dist/$ASSET"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  package:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gh-tui-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          chmod +x gh-tui-*
          sha256sum gh-tui-* | tee SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # The binaries are built and checksummed; publishing waits for a person to approve the `release`
  # environment (Settings > Environments > release > Required reviewers).
  approve:
    name: approve release
    needs: [meta, package]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - run: echo "approved ${{ needs.meta.outputs.tag }}"

  attest:
    name: provenance
    needs: [meta, approve]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gh-tui-*

  release:
    name: publish release
    needs: [meta, attest]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # a tag pushed by hand already exists; one started from the Actions tab is made here, at the
      # validated commit. (A tag created with GITHUB_TOKEN does not start another run of this workflow.)
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          [[ "$TAG" =~ $TAG_RE ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          [[ "$TAG" =~ $TAG_RE ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" "${flags[@]}" dist/*
