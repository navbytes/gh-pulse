[package]
name = "gh-pulse"
version = "0.1.0"
edition = "2024"
description = "A lazygit-style terminal UI for GitHub: review PRs, diffs, checks, issues, runs and releases through the gh CLI"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/navbytes/gh-pulse"
homepage = "https://github.com/navbytes/gh-pulse"
readme = "README.md"
keywords = ["github", "tui", "gh", "pull-requests", "code-review"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", optional = true, default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
toml = "0.9"
unicode-width = "0.2"

[features]
# Syntax-highlighted diffs: +2.8 MB binary (1.6 -> 4.4 MB), so opt-in. `cargo build --release --features syntax`.
syntax = ["dep:syntect"]
