[package]
name = "gh-tui"
version = "0.3.0"
edition = "2024"
description = "A lazygit-style terminal UI for GitHub: review PRs, diffs, checks, issues, runs and releases through the gh CLI"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/navbytes/gh-tui"
homepage = "https://github.com/navbytes/gh-tui"
readme = "README.md"
keywords = ["github", "tui", "gh", "pull-requests", "code-review"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
syntect = { version = "5.3.0", optional = true, default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
toml = "1.1"
unicode-width = "0.2"

[features]
default = ["syntax"]
# Syntax-highlighted diffs and code blocks (adds ~2.8 MB; `--no-default-features` gives the small plain build).
syntax = ["dep:syntect"]
